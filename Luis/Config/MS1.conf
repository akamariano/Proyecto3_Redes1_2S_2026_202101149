enable
configure terminal
hostname MS1
no ip domain-lookup
ip routing
vtp mode transparent
vlan 84
 name Boveda
exit
vlan 94
 name Plataforma
exit
interface GigabitEthernet1/0/1
 no switchport
 ip address 10.49.0.34 255.255.255.252
 no shutdown
exit
interface Port-channel12
 switchport mode trunk
 switchport trunk allowed vlan 84,94
 no shutdown
exit
interface GigabitEthernet1/0/2
 switchport mode trunk
 switchport trunk allowed vlan 84,94
 channel-group 12 mode active
 no shutdown
exit
interface GigabitEthernet1/0/3
 switchport mode trunk
 switchport trunk allowed vlan 84,94
 channel-group 12 mode active
 no shutdown
exit
interface GigabitEthernet1/0/4
 switchport mode trunk
 switchport trunk allowed vlan 84,94
 no shutdown
exit
interface GigabitEthernet1/0/5
 switchport mode trunk
 switchport trunk allowed vlan 84,94
 no shutdown
exit
interface Vlan84
 ip address 10.49.30.130 255.255.255.192
 standby 84 ip 10.49.30.129
 standby 84 priority 110
 standby 84 preempt
 no shutdown
exit
interface Vlan94
 ip address 10.49.30.2 255.255.255.128
 standby 94 ip 10.49.30.1
 standby 94 priority 110
 standby 94 preempt
 no shutdown
exit
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 passive-interface Vlan84
 passive-interface Vlan94
exit
spanning-tree mode rapid-pvst
spanning-tree vlan 84 priority 24576
spanning-tree vlan 94 priority 24576
end
write memory

enable
configure terminal
hostname CORE-3
no ip domain-lookup
ip routing
!
! Po13 toward CORE-1
interface range GigabitEthernet1/1/1 - 2
 no switchport
 channel-group 13 mode active
 no shutdown
exit
interface Port-channel13
 no switchport
 ip address 10.49.0.6 255.255.255.252
exit
!
! Po23 toward CORE-2
interface range GigabitEthernet1/1/3 - 4
 no switchport
 channel-group 23 mode active
 no shutdown
exit
interface Port-channel23
 no switchport
 ip address 10.49.0.10 255.255.255.252
exit
!
! Routed link toward MS1 (cabled at merge time, RIPv2 domain)
interface GigabitEthernet1/0/1
 no switchport
 ip address 10.49.0.33 255.255.255.252
 no shutdown
exit
!
! Routed link toward MS2 (cabled at merge time, RIPv2 domain)
interface GigabitEthernet1/0/2
 no switchport
 ip address 10.49.0.37 255.255.255.252
 no shutdown
exit
!
router ospf 1
 router-id 3.3.3.3
 network 10.49.0.4 0.0.0.3 area 0
 network 10.49.0.8 0.0.0.3 area 0
end
write memory
enable
configure terminal
!
! RIPv2 domain toward MS1 and MS2 (Oriente)
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 passive-interface Port-channel13
 passive-interface Port-channel23
 redistribute ospf 1 metric 2
exit
!
! Inject Oriente routes into the core
router ospf 1
 redistribute rip subnets
end
write memory
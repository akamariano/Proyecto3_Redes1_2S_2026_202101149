! BanTech GT - extractos de configuracion del maestro final, 23/10/2026.
! Cada bloque se aplica SOLO al equipo indicado. No pegar todo en un equipo.
! No es un volcado completo: se omiten puertos libres y valores por defecto.
!
! ==================== CORE-1 ====================
enable
configure terminal
hostname CORE-1
ip routing
interface GigabitEthernet1/1/1
 no switchport
 channel-group 12 mode active
 no shutdown
exit
interface GigabitEthernet1/1/2
 no switchport
 channel-group 12 mode active
 no shutdown
exit
interface GigabitEthernet1/1/3
 no switchport
 channel-group 13 mode active
 no shutdown
exit
interface GigabitEthernet1/1/4
 no switchport
 channel-group 13 mode active
 no shutdown
exit
interface Port-channel12
 no switchport
 ip address 10.49.0.1 255.255.255.252
 no shutdown
exit
interface Port-channel13
 no switchport
 ip address 10.49.0.5 255.255.255.252
 no shutdown
exit
interface GigabitEthernet1/0/1
 no switchport
 ip address 10.49.0.13 255.255.255.252
 no shutdown
exit
router ospf 1
 router-id 1.1.1.1
 network 10.49.0.0 0.0.0.3 area 0
 network 10.49.0.4 0.0.0.3 area 0
 network 10.49.0.12 0.0.0.3 area 0
exit
end
write memory
!

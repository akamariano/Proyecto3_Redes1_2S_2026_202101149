! ==================== CORE-3 ====================
enable
configure terminal
hostname CORE-3
ip routing
interface GigabitEthernet1/1/1
 no switchport
 channel-group 13 mode active
 no shutdown
exit
interface GigabitEthernet1/1/2
 no switchport
 channel-group 13 mode active
 no shutdown
exit
interface GigabitEthernet1/1/3
 no switchport
 channel-group 23 mode active
 no shutdown
exit
interface GigabitEthernet1/1/4
 no switchport
 channel-group 23 mode active
 no shutdown
exit
interface Port-channel13
 no switchport
 ip address 10.49.0.6 255.255.255.252
 no shutdown
exit
interface Port-channel23
 no switchport
 ip address 10.49.0.10 255.255.255.252
 no shutdown
exit
interface GigabitEthernet1/0/1
 no switchport
 ip address 10.49.0.33 255.255.255.252
 no shutdown
exit
interface GigabitEthernet1/0/2
 no switchport
 ip address 10.49.0.37 255.255.255.252
 no shutdown
exit
! Resumen de retorno de Oriente. Las rutas RIP /25 y /26 son mas especificas.
! La segunda ruta es flotante respecto de la primera, para el MISMO /24.
ip route 10.49.30.0 255.255.255.0 10.49.0.38 250
ip route 10.49.30.0 255.255.255.0 10.49.0.34 251
router ospf 1
 router-id 3.3.3.3
 network 10.49.0.4 0.0.0.3 area 0
 network 10.49.0.8 0.0.0.3 area 0
 redistribute rip subnets
 redistribute static subnets
exit
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 redistribute ospf 1 metric 2
exit
end
write memory
